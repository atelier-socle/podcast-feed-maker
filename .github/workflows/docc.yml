name: Generate DocC

on:
  workflow_dispatch:

jobs:
  generate-docc:
    runs-on: macos-latest

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v3

      - name: 🛠️ Set up Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0"

      - name: 🧪 Build documentation
        run: |
          mkdir -p docs
          swift package --allow-writing-to-directory docs             generate-documentation --target PodcastFeedMaker             --output-path docs             --transform-for-static-hosting             --hosting-base-path PodcastFeedMaker

      - name: 📦 Upload doc as artifact
        uses: actions/upload-artifact@v3
        with:
          name: docc-html
          path: docs
